name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Set-up Python virutal environment
        working-directory: ./webdevadv/solver
        run: python -m venv venv

      - name: Activate virtual environment
        working-directory: ./webdevadv/solver
        run: source venv/bin/activate

      - name: Install Python dependencies
        working-directory: ./webdevadv/solver
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: ./webdevadv
        run: npm test