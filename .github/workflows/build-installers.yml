# Builds the Windows, Apple Silicon Mac and Intel Mac installers on GitHub's computers.
# PyInstaller can only build for the computer it runs on, so each installer
# is built on its own operating system.
#
# Runs by itself on every push/merge to main (or by hand: Actions -> Build installers
# -> Run workflow). If all 3 builds pass, the "release" job puts the 3 installers in
# the "latest" release on the repo's Releases page, replacing the old ones.

name: Build installers

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: build:win
            installer: webdevadv/dist/*.exe
            name: theater-scheduler-windows
            # Where the packaged solver ends up inside the built app
            solver: dist/win-unpacked/resources/solver/solver.exe
          - os: macos-latest # Apple Silicon (arm64)
            build: build:mac
            installer: webdevadv/dist/*.dmg
            name: theater-scheduler-mac-apple-silicon
            solver: dist/mac-arm64/Theater Scheduler.app/Contents/Resources/solver/solver
          - os: macos-15-intel # Intel (x64)
            build: build:mac
            installer: webdevadv/dist/*.dmg
            name: theater-scheduler-mac-intel
            solver: dist/mac/Theater Scheduler.app/Contents/Resources/solver/solver

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: webdevadv

    env:
      # The app is unsigned; don't let electron-builder look for signing certificates.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webdevadv/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      # build:solver uses .venv/bin/python (Mac) or .venv\Scripts\python.exe (Windows)
      - name: Create Python environment with the solver's packages
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install -r solver/requirements.txt -r solver/requirements-build.txt

      - name: Install Node packages
        run: npm ci

      - name: Build installer (solver bundle, app, installer)
        run: npm run ${{ matrix.build }}

      # Runs the solver that was packed into the app on the sample data, and checks it
      # gives the same schedule as running solver.py with Python. Fails the build if not.
      - name: Check the packaged solver makes a schedule
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "${{ matrix.solver }}" < solver/sample_input.json > packaged-output.json
          "$PY" solver/solver.py < solver/sample_input.json > python-output.json
          "$PY" - <<'EOF'
          import json, sys
          packaged = json.load(open("packaged-output.json"))
          python = json.load(open("python-output.json"))
          print("Packaged solver status:", packaged["status"], "| servers scheduled:", len(packaged["assignments"]))
          if packaged["status"] not in ("OPTIMAL", "FEASIBLE") or not packaged["assignments"]:
              sys.exit("FAIL: the packaged solver did not make a schedule")
          if (packaged["status"], packaged["assignments"]) != (python["status"], python["assignments"]):
              sys.exit("FAIL: the packaged solver's schedule is different from solver.py's")
          print("PASS: same schedule as solver.py")
          EOF

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.installer }}
          if-no-files-found: error

  # Runs only if all 3 builds above passed, and only for main.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # lets this job edit the Releases page

    steps:
      - name: Download the 3 installers from the builds
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Replace the "latest" release with the new installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l installers
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest installers/* \
            --target "${{ github.sha }}" \
            --latest \
            --title "Theater Scheduler (latest)" \
            --notes "Download the file for your computer:

          - **Windows**: \`theater-scheduler-<version>-setup.exe\`
          - **Mac with M1/M2/M3/M4 chip**: \`theater-scheduler-<version>-arm64.dmg\`
          - **Mac with Intel chip**: \`theater-scheduler-<version>-x64.dmg\`

          Not sure which Mac you have? Apple menu → About This Mac → \"Chip\" (Apple M…) or \"Processor\" (Intel).

          The app isn't signed, so the first time you open it:
          - **Mac**: open it once, then System Settings → Privacy & Security → Open Anyway.
          - **Windows**: on \"Windows protected your PC\", click More info → Run anyway.

          Built automatically from commit ${{ github.sha }}."
